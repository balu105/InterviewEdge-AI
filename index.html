
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireAI | Enterprise Talent Kernel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-deep: #050608;
        --bg-surface: #0c0e14;
        --accent-primary: #6366f1;
        --accent-secondary: #a855f7;
        --border-glass: rgba(255, 255, 255, 0.06);
        --text-dim: #64748b;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-deep);
        color: #f8fafc;
        margin: 0;
        overflow-x: hidden;
      }

      /* Advanced Mesh Background */
      .mesh-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: 
          radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.1) 0px, transparent 50%),
          radial-gradient(at 50% 100%, rgba(30, 64, 175, 0.1) 0px, transparent 50%);
        opacity: 0.8;
      }

      .noise-overlay {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.03;
        pointer-events: none;
      }

      /* Advanced Glassmorphism */
      .glass-panel {
        background: rgba(12, 14, 20, 0.6);
        backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid var(--border-glass);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
      }

      .glass-panel-hover {
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .glass-panel-hover:hover {
        background: rgba(20, 23, 33, 0.8);
        border-color: rgba(99, 102, 241, 0.3);
        transform: translateY(-4px);
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
      }

      /* Component: Glowing Elements */
      .glow-indigo {
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
      }

      .glow-text {
        text-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
      }

      /* Typewriter/Data Font */
      .font-mono-tech {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Animations */
      @keyframes slideInUp {
        from { opacity: 0; transform: translateY(30px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      .stagger-1 { animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .stagger-2 { animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; opacity: 0; }
      .stagger-3 { animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; opacity: 0; }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg-deep); }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; transition: background 0.2s; }
      ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }
    </style>
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.45.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "recharts": "https://esm.sh/recharts@^3.6.0"
      }
    }
    </script>
  </head>
  <body class="antialiased">
    <div class="mesh-bg"></div>
    <div class="noise-overlay"></div>
    <div id="root"></div>
  </body>
</html>
